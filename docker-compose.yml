# Jenkins. Uses network "automation-net" so the grid (docker-compose.grid-only.yml) can join the same network and Jenkins can reach selenium-hub:4444.
# The network is created automatically when you run this compose; no need to run "docker network create" first.
# See docs/JENKINS.md.

version: "3.8"

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins

    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - automation-net

volumes:
  jenkins_home:

networks:
  automation-net:
    driver: bridge