# Prometheus config for test-platform metrics and trend analysis.
# Scrapes Pushgateway (metrics pushed after test runs) and Prometheus itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Pushgateway: test runs push metrics here (e.g. pass/fail counts, duration).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Prometheus self-metrics (health and usage).
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
